[project]
name = "governed-contract-compliance-agent"
version = "0.1.0"
description = "Enterprise multi-tenant contract compliance and invoice reconciliation agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.52.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/domain",
    "src/gateway",
    "src/ingestion",
    "src/ports",
    "src/rag",
    "src/tools",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

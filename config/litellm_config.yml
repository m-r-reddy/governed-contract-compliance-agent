model_list:
  # Tier 1: High-throughput, low-cost extraction (Invoice Parsing)
  - model_name: extraction-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Tier 2: High-reasoning frontier synthesis (Contract Compliance Audit)
  - model_name: compliance-reasoning
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # Tier 2 Fallback: OpenAI GPT-4o if Anthropic is rate-limited or degraded
  - model_name: compliance-reasoning-fallback
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Embeddings model for ACL-Aware Hybrid RAG
  - model_name: text-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 30
  fallbacks:
    - {"compliance-reasoning": ["compliance-reasoning-fallback"]}
    - {"extraction-fast": ["compliance-reasoning-fallback"]}
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL